<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Explore destinations with Travel and Tours by Anne.">
<title>Explore Destinations | Travel and Tours by Anne</title>
<style>
:root{--navy:#102c43;--gold:#d4a85f;--cream:#faf7f2}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--navy);line-height:1.65;background:var(--cream)}
a{color:inherit}header{background:white;padding:20px 7%;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}header a{text-decoration:none;font-weight:700}header a:hover{text-decoration:underline}.hero{padding:110px 7%;background:linear-gradient(90deg,rgba(5,27,43,.85),rgba(5,27,43,.2)),var(--photo) center/cover;color:white;min-height:440px;display:flex;align-items:center}.hero-inner{max-width:780px}.eyebrow{text-transform:uppercase;letter-spacing:3px;font-weight:700;color:#f2d39c;font-size:.85rem}h1{font-size:clamp(2.5rem,6vw,4.5rem);line-height:1.15;margin:15px 0}h2{font-size:clamp(1.7rem,3vw,2.4rem)}.intro{font-size:1.15rem}.content{max-width:1120px;margin:auto;padding:65px 7%}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px 0}.card{background:white;padding:24px;border:1px solid #e9e6df;border-radius:14px}.card h3{margin-top:0}.actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}.btn{display:inline-block;background:var(--gold);padding:13px 22px;border-radius:7px;font-weight:700;text-decoration:none}.btn.secondary{background:var(--navy);color:white}.note{color:#596875}footer{background:#091f31;color:white;text-align:center;padding:25px}@media(max-width:700px){.cards{grid-template-columns:1fr}.hero{min-height:350px;padding:70px 7%}}
</style>
</head>
<body>
<header><a href="index.html">Travel and Tours by Anne</a><a href="index.html#destinations">← All Destinations</a></header>
<main>
<section class="hero" id="hero"><div class="hero-inner"><div class="eyebrow">Get Inspired</div><h1 id="heading"></h1><p class="intro" id="intro"></p></div></section>
<section class="content"><h2 id="section-heading"></h2><p id="description"></p><div class="cards" id="cards"></div><p class="note">Destinations and experiences are for inspiration. Tour availability, itineraries and pricing are confirmed individually.</p><div class="actions"><a class="btn" id="inquire" href="index.html#private-tours">Plan a Private Tour</a><a class="btn secondary" href="https://m.me/travelandtoursbyanne" target="_blank" rel="noopener noreferrer">Ask Us on Messenger</a></div></section>
</main>
<footer>Travel and Tours by Anne · Your Journey, Beautifully Planned.</footer>
<script>
const destinations={
 japan:{title:'Explore Japan',intro:'Culture, cuisine, cities, and timeless discoveries.',description:'From lively cities to peaceful temples and traditional neighborhoods, Japan offers memorable experiences for many kinds of travellers.',heading:'Ideas for Your Japan Adventure',photo:'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1600&q=85',highlights:[['Tokyo','Discover dynamic neighborhoods, food, shopping and modern city life.'],['Kyoto','Explore temples, traditional streets and cultural landmarks.'],['Osaka','Enjoy lively city experiences and local cuisine.']]},
 bali:{title:'Discover Bali',intro:'Tropical escapes and beautiful island experiences.',description:'Bali combines tropical scenery, cultural traditions, beautiful coastlines and places to unwind.',heading:'Ideas for Your Bali Adventure',photo:'https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=1600&q=85',highlights:[['Ubud','Explore arts, nature and cultural experiences.'],['Temples','Discover beautiful landmarks and Balinese traditions.'],['Coastlines','Enjoy beaches, sunsets and relaxed island days.']]},
 more:{title:'More Adventures Await',intro:'Tell us where your travel dreams are taking you.',description:'Have another destination in mind? Share your travel dates, preferred places and interests so we can discuss a trip tailored to you.',heading:'Your Journey, Your Way',photo:'https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1600&q=85',highlights:[['Choose a Destination','Tell us the country or places you would love to visit.'],['Share Your Preferences','Let us know your travel dates, group size and interests.'],['Start Planning','Send an inquiry and we can discuss possible arrangements.']]}
};
const key=new URLSearchParams(location.search).get('place');
const selected=Object.prototype.hasOwnProperty.call(destinations,key)?key:'more';
const data=destinations[selected];
document.title=data.title+' | Travel and Tours by Anne';
document.getElementById('hero').style.setProperty('--photo',`url("${data.photo}")`);
document.getElementById('heading').textContent=data.title;
document.getElementById('intro').textContent=data.intro;
document.getElementById('section-heading').textContent=data.heading;
document.getElementById('description').textContent=data.description;
const cards=document.getElementById('cards');
for(const [title,description] of data.highlights){const article=document.createElement('article');article.className='card';const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=description;article.append(h,p);cards.appendChild(article)}
if(selected!=='more')document.getElementById('inquire').href='index.html#private-tours';

/* Show published Sanity destinations on More Adventures only */
// Line 40: existing comment
/* Show published Sanity destinations on More Adventures only */

// Line 41: new code starts here
if (selected === 'more') {
  const projectId = 'eb0bffrp';
  const dataset = 'production';

  const query = `*[_type == "destination"] | order(name asc) {
    name,
    description,
    duration,
    currency,
    startingPrice,
    travelPeriod,
    departure,
    bookingNotes,
    "photoUrl": photo.asset->url
  }`;
 
  const url =
    `https://${projectId}.api.sanity.io/v2025-02-19/data/query/${dataset}` +
    `?perspective=published&query=${encodeURIComponent(query)}`;

  fetch(url)
    .then(response => {
      if (!response.ok) throw new Error('Could not load destinations');
      return response.json();
    })
    .then(data => {
      const destinationsFromSanity = data.result || [];
      if (!destinationsFromSanity.length) return;

      const cards = document.getElementById('cards');
      cards.innerHTML = '';
      cards.style.gridTemplateColumns =
        'repeat(auto-fit, minmax(min(100%, 320px), 1fr))';
      cards.style.gap = '24px';

      for (const destination of destinationsFromSanity) {
        const article = document.createElement('article');
        article.className = 'card';
        article.style.padding = '0';
        article.style.overflow = 'hidden';
        article.style.borderRadius = '18px';

        if (destination.photoUrl) {
          const img = document.createElement('img');
          img.src = destination.photoUrl;
          img.alt = destination.name || 'Travel destination';
          img.loading = 'lazy';
          img.style.display = 'block';
          img.style.width = '100%';
          img.style.height = '220px';
          img.style.objectFit = 'cover';
          article.appendChild(img);
        }

        const content = document.createElement('div');
        content.style.padding = '24px';

        function addText(tag, value, styles = {}) {
          const element = document.createElement(tag);
          element.textContent = value;
          Object.assign(element.style, styles);
          content.appendChild(element);
        }

        addText('h3', destination.name || 'Destination', {
          fontSize: '24px',
          margin: '0 0 8px'
        });

        if (destination.duration) {
          addText('div', destination.duration.toUpperCase(), {
            fontSize: '13px',
            fontWeight: '700',
            color: '#66717b',
            marginBottom: '14px'
          });
        }

        if (destination.description) {
          addText('p', destination.description, {
            fontSize: '16px',
            lineHeight: '1.7',
            margin: '0 0 20px'
          });
        }

        if (destination.startingPrice != null) {
          const divider = document.createElement('hr');
          divider.style.border = '0';
          divider.style.borderTop = '1px solid #e9e6df';
          divider.style.margin = '20px 0';
          content.appendChild(divider);

          const currency =
            destination.currency === 'PHP' ? 'PHP' : 'USD';
          const amount = Number(destination.startingPrice)
            .toLocaleString('en-US', {
              maximumFractionDigits: 2
            });

          addText(
            'div',
            currency === 'PHP'
              ? `From ₱${amount}/person`
              : `From USD ${amount}/person`,
            {
              fontSize: '22px',
              fontWeight: '700',
              marginBottom: '16px'
            }
          );
        }

        if (destination.travelPeriod) {
          addText('p', `📅 ${destination.travelPeriod}`, {
            fontSize: '15px',
            margin: '10px 0'
          });
        }

        if (destination.departure) {
          addText('p', `✈️ Departure: ${destination.departure}`, {
            fontSize: '15px',
            margin: '10px 0'
          });
        }

        if (destination.bookingNotes) {
          addText('p', destination.bookingNotes, {
            fontSize: '13px',
            lineHeight: '1.6',
            color: '#66717b',
            margin: '18px 0 0'
          });
        }

        article.appendChild(content);
        cards.appendChild(article);
      }

      document.getElementById('section-heading').textContent =
        'Explore More Destinations';
    })
    .catch(error => {
      console.error('Sanity destinations could not load:', error);
    });
}
</script>
</body>
</html>
